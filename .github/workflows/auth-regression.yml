name: Auth regression
on:
  push:
    branches: [preview/v9-new-hero-do-case]
  pull_request:
    branches: [main, preview/v9-new-hero-do-case]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build portable Ultra-Premium review (PR #16 only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ats-control-v2-zoho-auth-plan'
        run: node scripts/package-control-v2-offline.cjs
      - name: Attach short-lived offline design review
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ats-control-v2-zoho-auth-plan'
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Ultra-Premium-Offline-Review
          path: dist/control-v2-offline/
          if-no-files-found: error
          retention-days: 1
